<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Roy Hudgens Academy Cougars paw logo</title>
  <desc id="desc">Cleaned paw mark based on a user-provided Hudgens Academy yearbook screenshot, colored navy with red and white trim from the football uniform.</desc>
  <defs>
    <g id="paw-mark">
      <path d="M345 583c-27-89 21-174 105-198 96-28 191 22 225 120 35 100-10 211-108 245-102 36-193-55-222-167z"/>
      <ellipse cx="242" cy="348" rx="70" ry="135" transform="rotate(-70 242 348)"/>
      <ellipse cx="438" cy="218" rx="72" ry="135" transform="rotate(-18 438 218)"/>
      <ellipse cx="637" cy="277" rx="68" ry="128" transform="rotate(42 637 277)"/>
      <ellipse cx="762" cy="445" rx="66" ry="123" transform="rotate(93 762 445)"/>
    </g>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#07162d" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#soft-shadow)" transform="translate(12 12)">
    <use href="#paw-mark" fill="#071A3D" stroke="#C64832" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#paw-mark" fill="#071A3D" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#paw-mark" fill="#071A3D"/>
  </g>
</svg>
